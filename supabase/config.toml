# AFTERHOURS – Konfiguration für die lokale Supabase-Umgebung (`supabase start`).
# Für das gehostete Projekt gelten die Einstellungen im Supabase-Dashboard; die für die App
# wichtigen (Site-URL, Redirect-URLs, E-Mail-Bestätigung, Passwortlänge, Vorlagen) sind in der
# README unter "Supabase einrichten" aufgeführt. Mit `supabase config push` lassen sie sich auch
# aus dieser Datei übertragen – vorher site_url und additional_redirect_urls anpassen.

project_id = "afterhours"

[api]
enabled = true
port = 54321
# Nur "public" ist über die API erreichbar. Interne Funktionen liegen in "app_private".
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Demo-Orte für Discover. Für ein Produktivprojekt NICHT einspielen (oder danach wieder entfernen).
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Lokales Postfach (Mailpit): http://127.0.0.1:54324 – hier landen Bestätigungs- und Reset-Mails.
[local_smtp]
enabled = true
port = 54324

# Die App nutzt keinen Datei-Speicher (Profilbilder liegen verkleinert im Profil).
[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**", "http://127.0.0.1:4173/**", "http://localhost:4173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# Lokal großzügig, damit der E2E-Test mehrere Konten anlegen kann. Im gehosteten Projekt gelten
# die Limits des Dashboards (dort die Standardwerte beibehalten oder verschärfen).
email_sent = 100
sign_in_sign_ups = 300
token_verifications = 300
token_refresh = 150

[auth.email]
enable_signup = true
# Registrierung erst nach bestätigter E-Mail-Adresse.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Bestätige deine E-Mail-Adresse für AFTERHOURS"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Neues Passwort für AFTERHOURS festlegen"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Neue E-Mail-Adresse für AFTERHOURS bestätigen"
content_path = "./supabase/templates/email_change.html"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# KI-Planungsassistent (optional). Nur angemeldete Nutzer dürfen die Funktion aufrufen.
[functions.assistant]
enabled = true
verify_jwt = true

# Echte Orte aus OpenStreetMap (siehe supabase/functions/places/index.ts).
[functions.places]
enabled = true
verify_jwt = true

[analytics]
enabled = false
