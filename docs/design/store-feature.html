<!doctype html>
<!--
  W7 · Vorstellungsgrafik für Google Play (store/grafik/play-feature-1024x500.png, 1024 × 500, ohne Transparenz).
  Neu erzeugen: node scripts/store-graphics.mjs (rendert alle Store-Grafiken aus docs/design/store-*.html).
  Google blendet am Rand Bedienelemente ein – Wichtiges bleibt mindestens 40 px vom Rand weg.
  Das Ticket ist ein Beispiel und als solches markiert (gleiche Welt wie Startseite und og-home).
-->
<html lang="de">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Big Shoulders Display"; src: url("../../public/fonts/BigShouldersDisplay-ExtraBold.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "Figtree"; src: url("../../public/fonts/Figtree-Variable.woff2") format("woff2"); font-weight: 300 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body { position: relative; background: #1c1e20; color: #f3f4f1; font-family: "Figtree", sans-serif; }
  .glow { position: absolute; right: -160px; top: -200px; width: 640px; height: 640px; border-radius: 50%;
          background: radial-gradient(circle, rgb(197 248 42 / 0.22), rgb(197 248 42 / 0) 65%); }
  .grain { position: absolute; inset: 0; opacity: .06; background-image: radial-gradient(#fff 0.6px, transparent 0.6px); background-size: 4px 4px; }
  .logo { position: absolute; left: 60px; top: 52px; display: flex; align-items: center; gap: 14px; }
  .logo span { font-family: "Big Shoulders Display"; font-weight: 800; font-size: 34px; letter-spacing: .04em; }
  .poster { position: absolute; left: 60px; bottom: 96px; font-family: "Big Shoulders Display"; font-weight: 800;
            font-size: 76px; line-height: .88; text-transform: uppercase; letter-spacing: .005em; }
  .poster em { font-style: normal; color: #c5f82a; display: block; }
  .claim { position: absolute; left: 63px; bottom: 48px; font-size: 19px; color: #a9aeaa; font-weight: 500; }
  .ticket-wrap { position: absolute; right: 52px; top: 118px; transform: rotate(-4deg); filter: drop-shadow(0 22px 30px rgb(0 0 0 / .5)); }
  .ticket { width: 370px; height: 250px; display: grid; grid-template-columns: 100px 1fr; border-radius: 24px; overflow: hidden;
            -webkit-mask: radial-gradient(circle 18px at 100px 0, transparent 17.5px, #000 18px) top / 100% 51% no-repeat,
                          radial-gradient(circle 18px at 100px 100%, transparent 17.5px, #000 18px) bottom / 100% 51% no-repeat; }
  .stub { background: #c5f82a; color: #141a00; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
          border-right: 3px dashed rgb(20 26 0 / .35); }
  .stub b { font-family: "Big Shoulders Display"; font-weight: 800; font-size: 70px; line-height: .85; }
  .stub small { font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .barcode { margin-top: 12px; width: 64px; height: 26px;
             background: repeating-linear-gradient(90deg, #141a00 0 3px, transparent 3px 5px, #141a00 5px 6px, transparent 6px 9px); }
  .main { background: #25282b; padding: 24px 24px 20px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .badge { border-radius: 999px; background: rgb(197 248 42 / .14); color: #c5f82a; font-weight: 700; font-size: 15px; padding: 5px 12px; }
  .example { border-radius: 999px; border: 2px solid #4d5359; color: #a9aeaa; font-weight: 700; font-size: 14px; padding: 3px 10px; }
  .title { font-family: "Big Shoulders Display"; font-weight: 800; font-size: 52px; line-height: .9; text-transform: uppercase; }
  .meta { font-size: 16px; color: #a9aeaa; font-weight: 600; margin-top: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; border-top: 2px dashed #363b40; padding-top: 14px; }
  .dots { display: flex; }
  .dots i { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #25282b; margin-left: -9px; }
  .dots i:first-child { margin-left: 0; }
  .going { white-space: nowrap; font-size: 16px; color: #a9aeaa; font-weight: 600; }
  .going b { font-family: "Big Shoulders Display"; font-size: 40px; color: #f3f4f1; margin-right: 6px; vertical-align: -4px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grain"></div>
  <div class="logo">
    <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#c5f82a" />
      <path d="M11.5 37 21.2 11h5.6L36.5 37h-6.1L24 18.6 17.6 37z" fill="#141a00" />
      <circle cx="24" cy="33.2" r="3.4" fill="#141a00" />
    </svg>
    <span>AFTERHOURS</span>
  </div>
  <div class="ticket-wrap">
    <div class="ticket">
      <div class="stub"><small>Sa</small><b>17</b><small>Okt</small><div class="barcode"></div></div>
      <div class="main">
        <div class="top"><span class="badge">Bestätigt</span><span class="example">Beispiel</span></div>
        <div>
          <p class="title">Bowling</p>
          <p class="meta">20:00 Uhr</p>
        </div>
        <div class="row">
          <div class="dots"><i style="background:#9db4ff"></i><i style="background:#ffb28a"></i><i style="background:#a8e6b8"></i><i style="background:#d9b8ff"></i></div>
          <span class="going"><b>4</b>von 5 dabei</span>
        </div>
      </div>
    </div>
  </div>
  <p class="poster">Ein Abend.<br />Eine Crew.<em>Kein Chat-Chaos.</em></p>
  <p class="claim">Abstimmen, Orte finden, Plan festmachen – mit deiner Crew.</p>
</body>
</html>
