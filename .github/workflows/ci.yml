# Prüft jeden Pull Request und jeden Stand auf main.
# Job „Browser-Journey“: tests/e2e/journey.mjs gegen eine lokale Supabase-Umgebung und den
# OSM-Stellvertreter (tests/e2e/osm-stub.mjs); Screenshots und Protokolle als Artefakt „journey“.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: TypeScript und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: .github/scripts/run.sh npm run typecheck
      # W2: Messenger-Vorschau (api/share.js) ohne Netz.
      - run: .github/scripts/run.sh npm run test:unit
      - run: .github/scripts/run.sh npm run build
        env:
          # Nur für den Build; die echten Werte setzt der Hoster.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      # Roadmap F3: Startgröße und größter Seiten-Chunk gegen scripts/bundle-budget.json.
      - run: .github/scripts/run.sh npm run size

  database:
    name: Datenbank (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: .github/scripts/run.sh supabase test db

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: .github/scripts/run.sh deno check supabase/functions/places/index.ts supabase/functions/assistant/index.ts supabase/functions/weather/index.ts
      - run: .github/scripts/run.sh deno test supabase/functions/places/osm_test.ts supabase/functions/places/overpass_test.ts supabase/functions/places/geocode_test.ts supabase/functions/weather/forecast_test.ts

  journey:
    name: Browser-Journey (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write nur für den Screenshot-Branch (.github/scripts/screenshots.sh).
    permissions:
      contents: write
    env:
      APP_URL: http://127.0.0.1:5173
      SUPABASE_URL: http://127.0.0.1:54321
      MAILPIT_URL: http://127.0.0.1:54324
      E2E_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      E2E_SCREENSHOTS: tests/e2e/screenshots
      E2E_LOGS: e2e-logs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Barrierefreiheitsprüfung (F2). Ohne Lockfile-Eintrag, solange die Entwicklungsumgebung keinen
      # npm-Zugriff hat; Version fest, damit die Regeln nicht unbemerkt wechseln.
      - run: npm install --no-save --no-audit --no-fund axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: .github/scripts/run.sh .github/scripts/e2e.sh setup
      - run: .github/scripts/run.sh npm run test:e2e
      - if: failure()
        run: .github/scripts/e2e.sh logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey
          path: |
            tests/e2e/screenshots
            e2e-logs
          if-no-files-found: ignore
          retention-days: 14
      # Roadmap F4: Screenshots auf Branch screenshots/main bzw. screenshots/pr-<n> (nur PRs aus diesem Repository).
      - if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: .github/scripts/run.sh .github/scripts/screenshots.sh
        env:
          TARGET: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
