# Prüft jeden Pull Request und jeden Stand auf main.
# Job „Browser-Journey“: tests/e2e/journey.mjs gegen eine lokale Supabase-Umgebung und den
# OSM-Stellvertreter (tests/e2e/osm-stub.mjs); Screenshots und Protokolle als Artefakt „journey“.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: TypeScript und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: .github/scripts/run.sh npm run typecheck
      - run: .github/scripts/run.sh npm run build
        env:
          # Nur für den Build; die echten Werte setzt der Hoster.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      # Roadmap F3: Startgröße und größter Seiten-Chunk gegen scripts/bundle-budget.json.
      - run: .github/scripts/run.sh npm run size

  database:
    name: Datenbank (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: .github/scripts/run.sh supabase test db

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: .github/scripts/run.sh deno check supabase/functions/places/index.ts supabase/functions/assistant/index.ts
      - run: .github/scripts/run.sh deno test supabase/functions/places/osm_test.ts

  journey:
    name: Browser-Journey (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://127.0.0.1:5173
      SUPABASE_URL: http://127.0.0.1:54321
      MAILPIT_URL: http://127.0.0.1:54324
      E2E_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      E2E_SCREENSHOTS: tests/e2e/screenshots
      E2E_LOGS: e2e-logs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: .github/scripts/run.sh .github/scripts/e2e.sh setup
      - run: .github/scripts/run.sh npm run test:e2e
      - if: failure()
        run: .github/scripts/e2e.sh logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey
          path: |
            tests/e2e/screenshots
            e2e-logs
          if-no-files-found: ignore
          retention-days: 14
